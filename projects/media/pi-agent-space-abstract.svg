<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="background-color: #16161a; font-family: system-ui, -apple-system, sans-serif;">
    <defs>
        
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#1f1f24"></stop>
            <stop offset="100%" stop-color="#16161a"></stop>
        </radialGradient>

        
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
            <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>
        <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
            <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>

        
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e08a6a" stop-opacity="0.15"></stop>
            <stop offset="100%" stop-color="#e08a6a" stop-opacity="0.02"></stop>
        </linearGradient>
        <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4a4a52" stop-opacity="0.8"></stop>
            <stop offset="100%" stop-color="#1f1f24" stop-opacity="0.9"></stop>
        </linearGradient>

        
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2e2e34" stroke-width="1" opacity="0.4"></path>
            <circle cx="0" cy="0" r="1" fill="#4a4a52" opacity="0.5"></circle>
        </pattern>
    </defs>

    
    <rect width="100%" height="100%" fill="url(#bgGrad)"></rect>
    <rect width="100%" height="100%" fill="url(#grid)"></rect>

    
