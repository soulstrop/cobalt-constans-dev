        <path d="M 325 400 Q 480 280 635 400" fill="none" stroke="url(#functor-grad)" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrow-accent)"></path>
    </g>

    
    <g>
        <circle cx="340" cy="212.5" r="12" fill="#1f1f24" stroke="#e08a6a" stroke-width="1"></circle>
        <text x="340" y="216.5" fill="#e08a6a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F</text>
        
        <circle cx="340" cy="587.5" r="12" fill="#1f1f24" stroke="#e08a6a" stroke-width="1"></circle>
        <text x="340" y="591.5" fill="#e08a6a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F</text>
        
        <circle cx="480" cy="340" r="12" fill="#1f1f24" stroke="#e08a6a" stroke-width="1"></circle>
        <text x="480" y="344" fill="#e08a6a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F</text>
    </g>

    
    <circle cx="250" cy="212.5" r="3" fill="#f4f3ef" filter="url(#glow)"></circle>
    <circle cx="250" cy="587.5" r="3" fill="#f4f3ef" filter="url(#glow)"></circle>
    <circle cx="402.5" cy="340" r="3" fill="#f4f3ef" filter="url(#glow)"></circle>

    
    
    
    
    <circle cx="400" cy="400" r="60" fill="url(#glow-grad)" pointer-events="none"></circle>
    
    <g filter="url(#shadow)">
        
