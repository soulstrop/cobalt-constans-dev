    <text x="750" y="765" fill="#e08a6a" font-family="monospace" font-size="12" text-anchor="end">✓ PROVABLY CONSISTENT</text>

    
    <rect width="800" height="800" fill="url(#vignette)" pointer-events="none"></rect>
