        <text x="250" y="280" fill="#2e2e34" font-family="monospace" font-size="10">f: A -&gt; B</text>

        
        
        <line x1="160" y1="325" x2="160" y2="475" stroke="#7a7872" stroke-width="2" marker-end="url(#arrow-fg3)"></line>
        
        <line x1="180.25" y1="485.5" x2="279.75" y2="414.5" stroke="#7a7872" stroke-width="2" marker-end="url(#arrow-fg3)"></line>
        
