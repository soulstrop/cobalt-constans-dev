<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#16161a"></stop>
            <stop offset="100%" stop-color="#1f1f24"></stop>
        </linearGradient>
        
        <linearGradient id="functor-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7a7872"></stop>
            <stop offset="100%" stop-color="#e08a6a"></stop>
        </linearGradient>

        <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
            <stop offset="50%" stop-color="#16161a" stop-opacity="0"></stop>
            <stop offset="100%" stop-color="#16161a" stop-opacity="0.8"></stop>
        </radialGradient>

        <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e08a6a" stop-opacity="0.4"></stop>
            <stop offset="100%" stop-color="#e08a6a" stop-opacity="0"></stop>
        </radialGradient>

        
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"></feDropShadow>
        </filter>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
        </filter>

        
        <marker id="arrow-fg3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 Z" fill="#7a7872"></path>
        </marker>
        
        <marker id="arrow-fg2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 Z" fill="#c4c2ba"></path>
        </marker>

        <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 Z" fill="#e08a6a"></path>
        </marker>

        
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2e2e34" stroke-width="1" opacity="0.5"></path>
        </pattern>
    </defs>

    
    <rect width="800" height="800" fill="url(#bg-grad)"></rect>
    <rect width="800" height="800" fill="url(#grid)"></rect>

    
    <circle cx="400" cy="400" r="320" fill="none" stroke="#2e2e34" stroke-width="1" stroke-dasharray="4 12"></circle>
    <circle cx="400" cy="400" r="330" fill="none" stroke="#2e2e34" stroke-width="2" stroke-dasharray="20 10 5 10"></circle>

    
    <text x="400" y="60" fill="#4a4a52" font-family="monospace" font-size="16" letter-spacing="2" text-anchor="middle">F(g ∘ f) = F(g) ∘ F(f)</text>
    <text x="400" y="750" fill="#4a4a52" font-family="monospace" font-size="16" letter-spacing="2" text-anchor="middle">F(id_A) = id_{F(A)}</text>

    
    <line x1="100" y1="400" x2="700" y2="400" stroke="#2e2e34" stroke-width="2" stroke-dasharray="10 10"></line>

    
    
    
    <g filter="url(#shadow)">
        
        <path d="M 220 210 L 384.5 305 L 384.5 495 L 220 590 L 55.5 495 L 55.5 305 Z" fill="#1f1f24" stroke="#4a4a52" stroke-width="2"></path>
        
        
        <text x="100" y="380" fill="#2e2e34" font-family="monospace" font-size="10" transform="rotate(-30 100 380)">policy = compose(risk, cover)</text>
