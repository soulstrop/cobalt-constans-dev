<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#1f1f24"/><stop offset="100%" stop-color="#16161a"/>
  </radialGradient>
  <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e08a6a" stop-opacity="0.18"/><stop offset="100%" stop-color="#e08a6a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="vmFill" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#4a4a52" stop-opacity="0.55"/><stop offset="100%" stop-color="#1f1f24" stop-opacity="0.95"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
  </filter>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 1 L 8 5 L 0 9 Z" fill="#e08a6a"/>
  </marker>
  <marker id="arrFg3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 1 L 8 5 L 0 9 Z" fill="#7a7872"/>
  </marker>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2e2e34" stroke-width="1" opacity="0.45"/>
    <circle cx="0" cy="0" r="1" fill="#4a4a52" opacity="0.5"/>
  </pattern>
  <g id="lock">
    <path d="M -3.5 -1 V -4.5 A 3.5 3.5 0 0 1 3.5 -4.5 V -1" fill="none" stroke="#c4c2ba" stroke-width="1.6"/>
    <rect x="-5.5" y="-1" width="11" height="8" rx="1.5" fill="#c4c2ba"/>
    <circle cx="0" cy="2.6" r="1.2" fill="#1f1f24"/>
  </g>
  <g id="cross">
    <path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#e08a6a" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</defs>

<rect width="800" height="800" fill="url(#bg)"/>
<rect width="800" height="800" fill="url(#grid)"/>
<circle cx="400" cy="390" r="230" fill="url(#coreGlow)"/>

<!-- corner brackets -->
<path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#4a4a52" stroke-width="2"/>
<path d="M 790 30 L 790 10 L 770 10" fill="none" stroke="#4a4a52" stroke-width="2"/>
<path d="M 10 770 L 10 790 L 30 790" fill="none" stroke="#4a4a52" stroke-width="2"/>
<path d="M 790 770 L 790 790 L 770 790" fill="none" stroke="#4a4a52" stroke-width="2"/>

<!-- ============ egress: internet allowed, host + LAN blocked ============ -->
<text x="400" y="96" fill="#c4c2ba" font-size="9" font-weight="bold" letter-spacing="1.5" text-anchor="middle">INTERNET</text>
<circle cx="400" cy="128" r="14" fill="#1f1f24" stroke="#c4c2ba" stroke-width="1.6"/>
<ellipse cx="400" cy="128" rx="6" ry="14" fill="none" stroke="#7a7872" stroke-width="1"/>
<line x1="386" y1="128" x2="414" y2="128" stroke="#7a7872" stroke-width="1"/>

<line x1="320" y1="195" x2="480" y2="195" stroke="#4a4a52" stroke-width="3" stroke-linecap="round"/>
<path d="M 326 195 l -6 8 M 342 195 l -6 8 M 358 195 l -6 8 M 374 195 l -6 8 M 426 195 l -6 8 M 442 195 l -6 8 M 458 195 l -6 8 M 474 195 l -6 8" stroke="#4a4a52" stroke-width="1"/>
<text x="310" y="199" fill="#7a7872" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="end">EGRESS FIREWALL</text>

<line x1="400" y1="232" x2="400" y2="146" stroke="#e08a6a" stroke-width="1.8" marker-end="url(#arrAcc)"/>

<line x1="335" y1="232" x2="335" y2="202" stroke="#7a7872" stroke-width="1.4" stroke-dasharray="3 3"/>
<use href="#cross" x="335" y="181"/>
<text x="335" y="164" fill="#7a7872" font-size="8.5" font-weight="bold" letter-spacing="1.5" text-anchor="middle">HOST</text>

<line x1="465" y1="232" x2="465" y2="202" stroke="#7a7872" stroke-width="1.4" stroke-dasharray="3 3"/>
<use href="#cross" x="465" y="181"/>
<text x="465" y="164" fill="#7a7872" font-size="8.5" font-weight="bold" letter-spacing="1.5" text-anchor="middle">LAN</text>

<!-- ============ the microVM behind the KVM boundary ============ -->
<rect x="254" y="234" width="292" height="312" rx="12" fill="none" stroke="#e08a6a" stroke-width="2"/>
<rect x="260" y="240" width="280" height="300" rx="9" fill="none" stroke="#e08a6a" stroke-width="0.8" opacity="0.5"/>
<rect x="268" y="248" width="264" height="284" rx="6" fill="url(#vmFill)" stroke="#4a4a52" stroke-width="1.5" filter="url(#shadow)"/>

<text x="284" y="273" fill="#f4f3ef" font-size="10" font-weight="bold" letter-spacing="1.5">MICROVM</text>
<text x="516" y="273" fill="#7a7872" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="end">FIRECRACKER · QEMU</text>
<line x1="284" y1="284" x2="516" y2="284" stroke="#2e2e34" stroke-width="1"/>

<g font-size="9" font-weight="bold" letter-spacing="0.5" text-anchor="middle">
  <rect x="284" y="302" width="76" height="26" rx="13" fill="#16161a" stroke="#c4c2ba" stroke-width="1.4"/>
  <text x="322" y="318" fill="#f4f3ef">claude code</text>
  <rect x="368" y="302" width="64" height="26" rx="13" fill="#16161a" stroke="#c4c2ba" stroke-width="1.4"/>
  <text x="400" y="318" fill="#f4f3ef">codex</text>
  <rect x="440" y="302" width="76" height="26" rx="13" fill="#16161a" stroke="#c4c2ba" stroke-width="1.4"/>
  <text x="478" y="318" fill="#f4f3ef">pi · …</text>
</g>

<text x="400" y="360" fill="#e08a6a" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle">FULL PERMISSIONS</text>

<rect x="290" y="376" width="220" height="56" rx="4" fill="#16161a" stroke="#2e2e34" stroke-width="1"/>
<circle cx="302" cy="387" r="2.2" fill="#4a4a52"/><circle cx="310" cy="387" r="2.2" fill="#4a4a52"/><circle cx="318" cy="387" r="2.2" fill="#4a4a52"/>
<text x="302" y="408" fill="#c4c2ba" font-size="10" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$ rm -rf /</text>
<text x="302" y="423" fill="#7a7872" font-size="8.5" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"># stays in here</text>

<rect x="284" y="452" width="232" height="62" rx="4" fill="#2e2e34" stroke="#4a4a52" stroke-width="1"/>
<path d="M 296 466 h 16 M 296 472 h 10 M 296 478 h 13" stroke="#7a7872" stroke-width="1.5" stroke-linecap="round"/>
<text x="400" y="479" fill="#f4f3ef" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle">GUEST KERNEL</text>
<text x="400" y="497" fill="#7a7872" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle">ITS OWN · NOT THE HOST'S</text>

<rect x="306" y="538" width="188" height="16" fill="#1a1a1f"/>
<text x="400" y="549" fill="#e08a6a" font-size="8" font-weight="bold" letter-spacing="1.5" text-anchor="middle">KVM · HARDWARE BOUNDARY</text>

<!-- ============ in: repository copied onto a disk image ============ -->
<rect x="82" y="364" width="38" height="48" rx="2" fill="#1f1f24" stroke="#4a4a52" stroke-width="1.5"/>
<path d="M 90 356 h 26 l 12 12 v 48 h -38 z" fill="#1f1f24" stroke="#c4c2ba" stroke-width="1.6"/>
<path d="M 116 356 v 12 h 12" fill="none" stroke="#c4c2ba" stroke-width="1.6"/>
<path d="M 97 380 h 22 M 97 389 h 16 M 97 398 h 20" stroke="#7a7872" stroke-width="1.5" stroke-linecap="round"/>
<text x="106" y="444" fill="#f4f3ef" font-size="9" font-weight="bold" letter-spacing="1.5" text-anchor="middle">REPOSITORY</text>
<text x="106" y="459" fill="#7a7872" font-size="7.5" font-weight="bold" letter-spacing="1" text-anchor="middle">HOST WORKING TREE</text>

<text x="196" y="336" fill="#e08a6a" font-size="8.5" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COPY IN</text>
<ellipse cx="196" cy="352" rx="14" ry="4.5" fill="#1f1f24" stroke="#c4c2ba" stroke-width="1.4"/>
<path d="M 182 352 v 16 a 14 4.5 0 0 0 28 0 v -16" fill="#1f1f24" stroke="#c4c2ba" stroke-width="1.4"/>
<line x1="140" y1="390" x2="250" y2="390" stroke="#e08a6a" stroke-width="1.8" marker-end="url(#arrAcc)"/>
<text x="196" y="410" fill="#7a7872" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle">DISK IMAGE</text>

<!-- ============ out: git bundle into its own ref namespace ============ -->
<line x1="550" y1="390" x2="636" y2="390" stroke="#e08a6a" stroke-width="1.8" marker-end="url(#arrAcc)"/>
<text x="593" y="378" fill="#e08a6a" font-size="8.5" font-weight="bold" letter-spacing="1.5" text-anchor="middle">GIT BUNDLE</text>
<circle cx="593" cy="390" r="5.5" fill="#16161a" stroke="#e08a6a" stroke-width="2" filter="url(#soft)"/>

<rect x="640" y="362" width="132" height="56" rx="4" fill="#1f1f24" stroke="#4a4a52" stroke-width="1.5"/>
<text x="706" y="386" fill="#f4f3ef" font-size="10" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">refs/isolate/*</text>
<text x="706" y="404" fill="#7a7872" font-size="7.5" font-weight="bold" letter-spacing="1" text-anchor="middle">SEPARATE NAMESPACE</text>

<line x1="706" y1="420" x2="706" y2="596" stroke="#7a7872" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#arrFg3)"/>

<!-- ============ shared tool stores, read-only at the VMM ============ -->
<line x1="400" y1="638" x2="400" y2="560" stroke="#7a7872" stroke-width="1.6" marker-end="url(#arrFg3)"/>
<text x="410" y="604" fill="#c4c2ba" font-size="8" font-weight="bold" letter-spacing="1">READ-ONLY AT THE VMM</text>
<rect x="306" y="640" width="188" height="58" rx="4" fill="#1f1f24" stroke="#4a4a52" stroke-width="1.5" filter="url(#shadow)"/>
<use href="#lock" x="328" y="666"/>
<text x="346" y="665" fill="#f4f3ef" font-size="9" font-weight="bold" letter-spacing="1.5">SHARED TOOL STORES</text>
<text x="346" y="682" fill="#7a7872" font-size="8" font-weight="bold" letter-spacing="0.5">TOOLCHAINS · CACHES</text>

<!-- ============ panels ============ -->
<!-- title -->
<rect x="30" y="30" width="250" height="100" rx="3" fill="#1f1f24" stroke="#2e2e34" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="26" y="40" width="4" height="80" fill="#e08a6a"/>
<text x="46" y="58" fill="#f4f3ef" font-size="14" font-weight="bold" letter-spacing="2.5">ISOLATE</text>
<text x="46" y="82" fill="#7a7872" font-size="9" letter-spacing="1">GUEST: <tspan fill="#e08a6a" font-weight="bold">ITS OWN KERNEL</tspan></text>
<text x="46" y="99" fill="#7a7872" font-size="9" letter-spacing="1">HOST SHARES: <tspan fill="#f4f3ef" font-weight="bold">NOTHING</tspan></text>
<text x="46" y="116" fill="#7a7872" font-size="9" letter-spacing="1">WORK RETURNS: <tspan fill="#f4f3ef" font-weight="bold">A GIT BUNDLE</tspan></text>

<!-- legend -->
<rect x="540" y="30" width="230" height="100" rx="3" fill="#1f1f24" stroke="#2e2e34" stroke-width="1.5" filter="url(#shadow)"/>
<text x="556" y="54" fill="#f4f3ef" font-size="10" font-weight="bold" letter-spacing="2">LEGEND</text>
<line x1="558" y1="74" x2="584" y2="74" stroke="#e08a6a" stroke-width="1.8" marker-end="url(#arrAcc)"/>
<text x="598" y="77" fill="#7a7872" font-size="8.5" letter-spacing="1">CROSSES THE BOUNDARY</text>
<use href="#cross" x="571" y="93"/>
<text x="598" y="96" fill="#7a7872" font-size="8.5" letter-spacing="1">BLOCKED AT EGRESS</text>
<use href="#lock" x="571" y="111"/>
<text x="598" y="115" fill="#7a7872" font-size="8.5" letter-spacing="1">READ-ONLY, VMM-ENFORCED</text>

<!-- container comparison -->
<rect x="30" y="600" width="250" height="170" rx="3" fill="#1f1f24" stroke="#2e2e34" stroke-width="1.5" filter="url(#shadow)"/>
<text x="46" y="630" fill="#f4f3ef" font-size="11" font-weight="bold" letter-spacing="2">VS. AN OCI CONTAINER</text>
<circle cx="52" cy="656" r="5" fill="none" stroke="#7a7872" stroke-width="1.6"/>
<text x="64" y="660" fill="#7a7872" font-size="9" font-weight="bold" letter-spacing="1">CONTAINER</text>
<text x="64" y="676" fill="#7a7872" font-size="8" letter-spacing="0.5">SHARES THE HOST KERNEL</text>
<text x="64" y="690" fill="#7a7872" font-size="8" letter-spacing="0.5">BIND-MOUNTS THE WORKING TREE</text>
<circle cx="52" cy="718" r="5" fill="#e08a6a"/>
<text x="64" y="722" fill="#e08a6a" font-size="9" font-weight="bold" letter-spacing="1">ISOLATE</text>
<text x="64" y="738" fill="#c4c2ba" font-size="8" letter-spacing="0.5">OWN KERNEL BEHIND KVM</text>
<text x="64" y="752" fill="#c4c2ba" font-size="8" letter-spacing="0.5">REPO COPIED IN · BUNDLE OUT</text>

<!-- review before merge -->
<rect x="540" y="600" width="230" height="170" rx="3" fill="#1f1f24" stroke="#2e2e34" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="770" y="610" width="4" height="150" fill="#e08a6a"/>
<text x="556" y="630" fill="#f4f3ef" font-size="11" font-weight="bold" letter-spacing="2">BEFORE YOU MERGE</text>
<g font-size="9" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <text x="556" y="662" fill="#c4c2ba">.github/workflows/</text>
  <text x="556" y="686" fill="#c4c2ba">.gitlab-ci.yml</text>
  <text x="556" y="710" fill="#c4c2ba">.git/hooks/</text>
  <text x="556" y="734" fill="#7a7872">src/**</text>
</g>
<g font-size="8.5" font-weight="bold" letter-spacing="1" text-anchor="end">
  <text x="754" y="662" fill="#e08a6a">⚑ CI</text>
  <text x="754" y="686" fill="#e08a6a">⚑ CI</text>
  <text x="754" y="710" fill="#e08a6a">⚑ HOOK</text>
  <text x="754" y="734" fill="#7a7872">✓ CLEAN</text>
</g>
<line x1="556" y1="748" x2="754" y2="748" stroke="#2e2e34" stroke-width="1"/>
<text x="556" y="762" fill="#7a7872" font-size="7.5" font-weight="bold" letter-spacing="1">RISKY PATHS FLAGGED · YOU DECIDE</text>
</svg>
