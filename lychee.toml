# lychee link-checker config — see https://lychee.cli.rs/usage/config/

# Tolerate slow third-party hosts: retry before giving up and allow more time
# per request. A single transient timeout on an external link should not fail
# the whole deploy (it did once on 2026-07-16, blocking a release).
max_retries = 3
retry_wait_time = 2
timeout = 30

exclude = [
  # LinkedIn returns HTTP 999 to block bots — not a real broken link.
  "linkedin\\.com",
  # WAF 403s the checker, verified live in browser 2026-05-26
  "https://www.mdpi.com/2504-2289/10/1/38",
  # Slow to respond; times out the checker intermittently but is live in browser.
  "^http://www\\.cs\\.ox\\.ac\\.uk/research/pdt/ap/ssgp/slides/fiadeiro\\.pdf",
  # Don't check our own deployed URLs (e.g. sitemap absolute URL in robots.txt).
  # The local build is the source of truth here.
  "^https?://(staging\\.)?constans\\.dev",
  # XML namespace identifier in sitemap.xml — not a fetchable link, and the
  # sitemaps spec mandates the http:// form. Must not be "resolved".
  "^http://www\\.sitemaps\\.org/schemas/sitemap/",
]
